<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1130, initial-scale=1.0">
    <title>Certificat</title>
    <style>
        @page {
            size: A4 landscape;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 1130px;
            height: 804px;
            overflow: hidden;
        }

        body {
            background: #f45a20;
            font-family: Arial, "Helvetica Neue", sans-serif;
        }

        .certificate-page {
            position: relative;
            width: 1130px;
            height: 804px;
            overflow: hidden;
        }

        .background {
            position: absolute;
            inset: 0;
            width: 1130px;
            height: 804px;
            display: block;

            object-fit: fill;
        }

        .certificate-card {
            position: absolute;

            left: 30px;
            top: 47px;
            width: 1070px;
            height: 726px;

            background: #ffffff;
            border-radius: 21px;
        }

        .certificate-border {
            position: absolute;

            left: 23px;
            top: 21px;
            right: 23px;
            bottom: 24px;

            border: 5px solid #3f3f3f;
            border-radius: 5px;
            pointer-events: none;
        }

        .brand {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);

            display: flex;
            align-items: center;

            white-space: nowrap;
        }

        .brand-mark {
            position: relative;
            height: 180px;
        }

        .certificate-title,
        .recipient,
        .training {
            margin: 0;
            position: absolute;
            text-align: center;
            white-space: nowrap;

            font-family: Arial Black, Arial, "Helvetica Neue", sans-serif;
            font-weight: 900;
            letter-spacing: -1.6px;
        }

        .certificate-title {
            top: 174px;
            left: 50%;
            transform: translateX(-50%);

            color: #ed5a22;
            font-size: 43px;
            line-height: 1;

            width: 1000px;
        }

        .intro {
            position: absolute;

            top: 246px;
            left: 0;
            width: 100%;

            margin: 0;

            text-align: center;
            white-space: nowrap;

            color: #2f2f2f;
            font-family: Arial, "Helvetica Neue", sans-serif;
            font-size: 29px;
            font-weight: 400;
            line-height: 1.15;
            letter-spacing: -0.5px;
        }

        .recipient {
            top: 321px;
            left: 0;
            width: 100%;

            color: #ed5a22;
            font-size: 59px;
            line-height: 1;
            letter-spacing: 0.2px;
        }

        .achievement {
            position: absolute;

            top: 418px;
            left: 0;
            width: 100%;

            margin: 0;
            padding: 0 55px;

            text-align: center;
            white-space: nowrap;

            color: #303030;
            font-family: Arial, "Helvetica Neue", sans-serif;
            font-size: 27px;
            font-weight: 400;
            line-height: 1.2;
            letter-spacing: -0.35px;
        }

        .training {
            top: 477px;
            left: 0;
            width: 100%;

            color: #242424;
            font-size: 53px;
            line-height: 1;
            letter-spacing: -2px;
        }

        .date-block {
            position: absolute;

            left: 130px;
            top: 600px;
            width: 145px;

            text-align: center;
        }

        .date-value {
            color: #4a4a4a;
            font-family: Arial, "Helvetica Neue", sans-serif;
            font-size: 18px;
            font-weight: 400;
            line-height: 1.25;
            white-space: nowrap;
        }

        .dotted-line {
            width: 100%;
            height: 1px;
            margin-top: 3px;

            border-top: 1px dotted #8d8d8d;
        }

        .field-label {
            margin-top: 14px;

            color: #454545;
            font-family: Arial, "Helvetica Neue", sans-serif;
            font-size: 15px;
            font-weight: 400;
            line-height: 1;
            letter-spacing: 0.2px;
        }


        .signature-block {
            position: absolute;

            left: 380px;
            top: 560px;
            width: 126px;

            text-align: center;
        }

        .signature-image {
            display: block;

            width: 126px;
            height: 64px;

            object-fit: contain;
            object-position: center bottom;
        }


        .stamp-block {
            position: absolute;

            left: 792px;
            top: 500px;

            width: 200px;
            height: 200px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stamp-image {
            display: block;

            width: 290px;
            height: 290px;

            object-fit: contain;
            object-position: center;
        }

        .verification-block {
            position: absolute;

            left: 561px;
            top: 550px;
            width: 178px;

            text-align: center;
        }

        .verification-qr {
            display: block;

            margin: 0 auto 8px;

            width: 92px;
            height: 92px;

            object-fit: contain;
        }

        .verification-label {
            margin: 0;

            color: #454545;
            font-family: Arial, "Helvetica Neue", sans-serif;
            font-size: 13px;
            font-weight: 400;
            line-height: 1.15;

            white-space: normal;
        }
    </style>
</head>

<body>
    <main class="certificate-page">

        <!-- Background fourni séparément -->
        <img class="background" src={{ background_image_url }} alt="">

        <!-- Grand support blanc -->
        <section class="certificate-card">
            <div class="certificate-border"></div>

            <!-- Logo : texte + symbole CSS pour rester éditable -->
            <div class="brand" aria-label="Xarala">
                <img class="brand-mark" src={{ certificate_logo_url }} alt="">
            </div>

            <!-- Titre -->
            <h1 class="certificate-title">CERTIFICAT DE FORMATION</h1>

            <!-- Introduction -->
            <p class="intro">Ce certificat est fièrement décerné à</p>

            <!-- Bénéficiaire -->
            <h2 class="recipient">{{ learner_name }}</h2>

            <!-- Texte de validation -->
            <p class="achievement">
                Pour avoir satisfait avec succès aux exigences du bootcamp
            </p>

            <h3 class="training"> {{ program_title }} </h3>

            <div class="date-block">
                <div class="date-value"> {{ date_generation }} </div>
                <div class="dotted-line"></div>
                <div class="field-label">DATE</div>
            </div>
            <div class="signature-block">
                <img src={{ signature_image_url }} class="signature-image" alt="Signature">
                <div class="dotted-line"></div>
                <div class="field-label">SIGNATURE</div>
            </div>

            <div class="stamp-block">
                <!-- Tampon fourni séparément -->
                <img src={{ stamp_image_url }} class="stamp-image" alt="Tampon Xarala">
            </div>

            <div class="verification-block">
                <img src={{ qr_code_data_uri }} class="verification-qr" alt="QR code de vérification">
                <p class="verification-label">
                    Vérifiez l'authenticité :<br>
                    {{ certificate_id }}
                </p>
            </div>
        </section>

    </main>
</body>

</html>
